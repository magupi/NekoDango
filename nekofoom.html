<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねこねこ団子屋さん フォーム送信</title>

    <!-- フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fdfdf8;
            padding: 40px;
        }

        .feedback-form {
            width: 80%;
            max-width: 700px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #aac766;
        }

        /* スマホ対応 */
        @media screen and (max-width: 768px) {
            body {
                padding: 20px;
            }
            .feedback-form {
                width: 100%;
                padding: 20px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="feedback-form">
        <h2 style="color:#4b7f93;">ご感想フォーム🐾</h2>

        <!-- ★ Googleフォーム埋め込み -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc0832ZTu5A7OC7tyXDQO39BVeju3u_z8HIwAs0tnAZBNfqmg/viewform?embedded=true" width="640" height="1072" frameborder="0" marginheight="0" marginwidth="0">読み込んでいます…</iframe>
    </div>

</body>
</html>
